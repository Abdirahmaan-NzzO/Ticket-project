{% extends 'base.html' %}

{% block title %}Link Invalid - TravelBook{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md text-center bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-6">
            <svg class="h-8 w-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-900 mb-4">Invalid Link</h2>
        <p class="text-gray-600 mb-6">
            The activation link you clicked is invalid or has expired. It may have already been used.
        </p>
        <a href="{% url 'accounts:register' %}" class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300">
            Register Again
        </a>
    </div>
</div>
{% endblock %}
