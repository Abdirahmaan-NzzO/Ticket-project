{% extends 'base.html' %}

{% block title %}Password Reset Complete - TravelBook{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md text-center bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-6">
            <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-900 mb-4">Password Reset!</h2>
        <p class="text-gray-600 mb-6">
            Your password has been set. You may go ahead and log in now.
        </p>
        <a href="{% url 'accounts:login' %}" class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300">
            Log in
        </a>
    </div>
</div>
{% endblock %}
